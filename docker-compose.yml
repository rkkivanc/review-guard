# Local ReviewGuard stack: gateway → backend(+scale) → mlc-llm
# Observability: Prometheus + Grafana + Loki/Promtail
#
#   # Stub LLM (default, no GPU):
#   docker compose up --build
#
#   # Real MLC-LLM (NVIDIA GPU) — stop stub first to free :8000, then:
#   docker compose stop mlc-llm
#   docker compose --profile gpu up
#
#   docker compose up --build --scale backend=2
#
# UI still runs on the host: cd frontend && npm run dev
# API via gateway: http://localhost:8088

name: review-guard

services:
  # CPU-friendly OpenAI-compatible stub (same contract as real MLC).
  mlc-llm:
    build: ./services/mlc-llm
    image: reviewguard-mlc-llm:local
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - ./peft-adapters:/adapters
    environment:
      MODEL_ID: "gemma-2-2b-it-q4f16_1-MLC"
      ADAPTERS_DIR: "/adapters"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      rg:
        aliases:
          - llm

  # Hardware-accelerated MLC-LLM runtime (requires NVIDIA Container Toolkit).
  llm-engine:
    profiles: ["gpu"]
    image: ghcr.io/mlc-ai/mlc-llm:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - ./peft-adapters:/adapters:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      mlc_llm serve /models/FinalBoss-7B-q4f16_1
      --model-lib-path /models/FinalBoss-7B/lib.so
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      rg:
        aliases:
          - llm
          - mlc-llm

  backend:
    build: ./backend
    image: reviewguard-backend:local
    # Named volumes are root-owned; local stack needs write access for DATA_DIR.
    user: "0:0"
    environment:
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:3000"
      MLC_LLM_URL: "http://llm:8000"
      MLC_MODEL_ID: "gemma-2-2b-it-q4f16_1-MLC"
      CLASSIFICATION_RUNS: "3"
      CLASSIFICATION_TEMPERATURE: "0.7"
      TRUST_THRESHOLD: "70"
      DATA_DIR: "/app/data"
      PEFT_ADAPTERS_DIR: "/app/peft-adapters"
      ADMIN_EMAILS: "admin@reviewguard.local"
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    volumes:
      - backend-data:/app/data
      - ./peft-adapters:/app/peft-adapters
    depends_on:
      mlc-llm:
        condition: service_healthy
        required: false
      llm-engine:
        condition: service_healthy
        required: false
    expose:
      - "8080"
    networks:
      - rg

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - rg

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - rg

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - rg

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    networks:
      - rg

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - rg

networks:
  rg:
    driver: bridge

volumes:
  backend-data:
  prometheus-data:
  loki-data:
  grafana-data:
